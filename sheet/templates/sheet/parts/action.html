{% load stats %}<section class="action-card action-{{ s.decision.action|default:'none' }}">
  <p class="eyebrow">Action named by the rules</p>
  <p class="action-name">{{ s.action_label }}</p>
  {% for sentence in s.reason %}<p>{% parts sentence %}</p>{% endfor %}
  <p class="fert-line">{% parts s.fertilizer %}</p>
  <p class="caveat">A gap compares two kinds of farm in the same district. It is not a forecast of how much yield
    would rise if the gap closed.</p>
</section>
