# Pipelines run on merge requests and on pushes to dev and main.
# Feature-branch pushes do not, so CI minutes stay on the reviews.
# The job checks the evidence contract and the Season A cell file.
# Application jobs are added when the Django project exists.

stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

default:
  interruptible: true

evidence:
  stage: test
  image: python:3.12-slim
  script:
    - python -m py_compile docs/build_evidence_contract.py tools/transcribe_season_a.py umusaruro/cells.py
    - python -m unittest tests.test_cells
    - test -f docs/Umusaruro-evidence-contract.docx
    - test -f docs/Umusaruro-evidence-contract.pdf
