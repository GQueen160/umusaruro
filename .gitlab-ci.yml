# Pipelines run on merge requests and on pushes to dev and main.
# Feature-branch pushes do not, so CI minutes stay on the reviews.
# evidence: the evidence contract, the Season A cell file, and the rules.
# app: the Django sheet, run with DEBUG off as it is deployed.

stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

default:
  interruptible: true

evidence:
  stage: test
  image: python:3.12-slim
  script:
    - python -m py_compile docs/build_evidence_contract.py tools/*.py umusaruro/*.py
    - python -m unittest discover -s tests
    - test -f docs/Umusaruro-evidence-contract.docx
    - test -f docs/Umusaruro-evidence-contract.pdf

app:
  stage: test
  image: python:3.12-slim
  variables:
    DJANGO_SECRET_KEY: ci-only-not-secret
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  script:
    - pip install -r requirements.txt
    - python manage.py check
    - python manage.py collectstatic --noinput
    - python manage.py test sheet
